<style>
:root{
  --ink:#14171a; --body:#2b3138; --muted:#5d6873; --faint:#8b95a1;
  --rule:#e2e6ea; --rule-soft:#eef1f4; --bg:#fdfdfc; --panel:#f6f7f8;
  --accent:#8a4b2a; --accent-soft:#f3e9e3; --good:#2f6b4f; --warn:#8a6d1f; --bad:#8f3232;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  --serif:'Instrument Serif',Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--body);font-family:var(--sans);
  font-size:17px;line-height:1.68;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:64px 24px 120px}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent);margin:0 0 20px}
h1{font-family:var(--serif);font-weight:400;font-size:46px;line-height:1.12;color:var(--ink);
  margin:0 0 22px;letter-spacing:-.01em}
h2{font-family:var(--serif);font-weight:400;font-size:30px;line-height:1.2;color:var(--ink);
  margin:64px 0 16px;letter-spacing:-.005em}
h3{font-size:18px;font-weight:640;color:var(--ink);margin:38px 0 10px;letter-spacing:-.002em}
p{margin:0 0 20px}
a{color:var(--accent);text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:.5px}
.standfirst{font-size:20px;line-height:1.55;color:var(--muted);margin:0 0 32px}
.byline{font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;color:var(--faint);
  border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:14px 0;margin:0 0 48px}
.byline strong{color:var(--body);font-weight:500}
.abstract{background:var(--panel);border-left:2px solid var(--accent);padding:22px 26px;margin:0 0 40px}
.abstract p{margin:0;font-size:16px;line-height:1.62}
.abstract .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent);display:block;margin-bottom:9px}
.snippet{border:1px solid var(--rule);border-radius:6px;padding:20px 22px;margin:30px 0;background:#fff}
.snippet .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--faint);display:block;margin-bottom:8px}
.snippet h4{margin:0 0 8px;font-size:16px;font-weight:640;color:var(--ink)}
.snippet p{margin:0 0 12px;font-size:15.5px;line-height:1.6;color:var(--muted)}
.snippet p:last-child{margin:0}
.snippet .fml{font-family:var(--mono);font-size:13.5px;background:var(--panel);padding:11px 14px;
  border-radius:4px;color:var(--ink);margin:12px 0;display:block;overflow-x:auto;white-space:pre}
figure{margin:44px 0;padding:0}
figure svg{display:block;width:100%;height:auto;border:1px solid var(--rule);border-radius:6px;background:#fff}
figcaption{font-family:var(--mono);font-size:11.5px;line-height:1.55;color:var(--faint);
  margin-top:11px;padding-left:2px}
figcaption b{color:var(--muted);font-weight:500;letter-spacing:.06em}
.tw{overflow-x:auto;margin:32px 0}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  text-align:left;color:var(--faint);border-bottom:1px solid var(--rule);padding:9px 12px 9px 0;font-weight:500}
td{border-bottom:1px solid var(--rule-soft);padding:11px 12px 11px 0;vertical-align:top;color:var(--muted)}
td:first-child{color:var(--body);font-weight:500}
td.n{font-family:var(--mono);font-size:13px;color:var(--ink);white-space:nowrap}
.pull{font-family:var(--serif);font-size:25px;line-height:1.34;color:var(--ink);
  border-left:2px solid var(--accent);padding:6px 0 6px 24px;margin:40px 0}
blockquote{margin:28px 0;padding:0 0 0 22px;border-left:2px solid var(--rule);color:var(--muted);font-size:16px}
ul,ol{margin:0 0 22px;padding-left:22px}
li{margin-bottom:9px}
code{font-family:var(--mono);font-size:14px;background:var(--panel);padding:1px 5px;border-radius:3px;color:var(--ink)}
.refs{margin-top:72px;border-top:1px solid var(--rule);padding-top:26px}
.refs h2{font-size:20px;margin:0 0 18px;font-family:var(--sans);font-weight:640}
.refs ol{list-style:none;padding:0;margin:0}
.refs li{font-size:14px;line-height:1.6;color:var(--muted);padding-left:26px;text-indent:-26px;margin-bottom:11px}
.note{font-size:13.5px;line-height:1.6;color:var(--faint);background:var(--panel);
  padding:16px 18px;border-radius:6px;margin:26px 0}
.mono{font-family:var(--mono)}
@media (max-width:640px){
  .wrap{padding:40px 18px 80px} h1{font-size:33px} h2{font-size:24px} body{font-size:16px}
  .standfirst{font-size:18px}
}
</style>
