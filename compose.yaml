# Production stack for the Hetzner box.
#
# Two services and two volumes. The volumes are the important part: both hold
# state that must OUTLIVE a release, and putting either inside the image
# reproduces by hand the per-deploy cache wipe that is a large part of why we
# are leaving Vercel.

name: indus

services:
  web:
    image: ghcr.io/sheesha-labs/indus-hydraulics:${IMAGE_TAG:-latest}
    restart: always
    # Bound to loopback: the reverse proxy on the host is the only thing that
    # should reach this. The origin must not be publicly reachable — Auth.js
    # runs with trustHost: true, so a directly-addressable port answers to any
    # Host header.
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    env_file:
      - /srv/indus/env/web.env
    environment:
      APP_ENV: production
      REDIS_URL: redis://cache:6379
    volumes:
      # ISR pages, the fetch cache, and the 30-day image cache. Re-transcoding
      # the images from cold is 1-2 CPU-hours, so this surviving a deploy is
      # worth more than any other line in this file.
      - next-cache:/app/apps/web/.next/cache
    depends_on:
      cache:
        condition: service_healthy
    healthcheck:
      # Liveness only — /api/health queries the database, and using it here
      # restarts a healthy container whenever Supabase blinks.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health/live"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          # Leaves headroom for the host and the proxy. Without a limit an
          # image-optimisation spike lets the kernel pick the victim, and it
          # will not pick the one you want.
          memory: ${WEB_MEMORY_LIMIT:-3g}
    logging:
      driver: json-file
      options:
        # A full disk makes this site silently stale rather than loudly broken,
        # which is the worse failure. Bound the logs.
        max-size: "20m"
        max-file: "5"

  cache:
    image: redis:7-alpine
    restart: always
    # Never published. Only `web` talks to it.
    command:
      - redis-server
      - --save
      - "900"
      - "1"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-512mb}
      # noeviction, not allkeys-lru: this holds the ISR cache and its tag
      # manifest. Evicting a tag entry silently resurrects pages the admin
      # purged, which is indistinguishable from the CMS not working.
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  next-cache:
  redis-data:
